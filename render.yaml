services:
  - type: web
    name: alocukurhatti-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alocukurhatti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: WEB_URL
        value: https://web-ten-kappa-37.vercel.app

databases:
  - name: alocukurhatti-db
    plan: free
    databaseName: alocukurhatti
    user: alocukurhatti
