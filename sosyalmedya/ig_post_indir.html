<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>IG Post — Alo Çukur Hattı İndir</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;}
  @page{size:1080px 1350px;margin:0;}
  html,body{width:1080px;height:1350px;font-family:'Segoe UI',-apple-system,Arial,sans-serif;color:#fff;overflow:hidden;}
  .canvas{
    width:1080px;height:1350px;position:relative;
    background:radial-gradient(ellipse at top, #1a1a1a 0%, #050505 70%);
    overflow:hidden;
  }
  /* dramatic red diagonal accent */
  .accent{
    position:absolute;top:-200px;right:-200px;width:700px;height:700px;
    background:radial-gradient(circle, rgba(229,57,53,.35) 0%, rgba(229,57,53,0) 70%);
    filter:blur(20px);
  }
  /* eyebrow */
  .eyebrow{
    position:absolute;top:90px;left:80px;
    display:inline-flex;align-items:center;gap:14px;
    padding:14px 26px;border-radius:999px;
    background:rgba(229,57,53,.15);border:1.5px solid rgba(229,57,53,.5);
    color:#FF6B6B;font-size:20px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  }
  .eyebrow .dot{width:10px;height:10px;border-radius:50%;background:#E53935;box-shadow:0 0 14px #E53935;}
  /* main headline */
  .headline{
    position:absolute;top:170px;left:80px;right:80px;
    font-size:88px;font-weight:900;line-height:1.02;letter-spacing:-.025em;
  }
  .headline .red{color:#E53935;}
  .sub{
    position:absolute;top:500px;left:80px;right:80px;
    font-size:28px;line-height:1.4;color:#cfcfcf;font-weight:400;
  }
  .sub b{color:#fff;font-weight:600;}
  /* phones */
  .phones{
    position:absolute;left:0;right:0;top:640px;height:520px;
    display:flex;justify-content:center;align-items:flex-start;gap:40px;
  }
  .phone{
    position:relative;
  }
  .phone img{height:540px;width:auto;display:block;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));}
  .phone.back{transform:translateY(40px) rotate(-7deg) scale(.92);opacity:.85;}
  .phone.front{transform:rotate(4deg);z-index:2;}
  /* CTA strip */
  .cta-strip{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(180deg, rgba(5,5,5,0) 0%, #0a0a0a 25%);
    padding:60px 80px 70px;
    display:flex;justify-content:space-between;align-items:flex-end;
  }
  .cta-text{
    flex:1;
  }
  .cta-text .lbl{
    font-size:18px;color:#888;text-transform:uppercase;letter-spacing:.2em;font-weight:700;margin-bottom:8px;
  }
  .cta-text .big{
    font-size:42px;font-weight:800;line-height:1.05;color:#fff;
  }
  .cta-text .big .red{color:#E53935;}
  .cta-text .links{
    margin-top:14px;font-size:22px;color:#aaa;
  }
  .cta-text .links b{color:#fff;font-weight:600;}
  /* App Store badge */
  .appbadge{
    display:flex;align-items:center;gap:14px;
    background:#fff;color:#000;
    padding:18px 30px;border-radius:18px;
    text-decoration:none;box-shadow:0 10px 30px rgba(255,255,255,.15);
  }
  .appbadge .apple{font-size:46px;line-height:1;color:#000;}
  .appbadge .at{font-size:14px;color:#555;text-transform:uppercase;letter-spacing:.15em;font-weight:700;}
  .appbadge .name{font-size:24px;font-weight:800;letter-spacing:-.01em;}
</style>
</head>
<body>
<div class="canvas">
  <div class="accent"></div>

  <div class="eyebrow"><span class="dot"></span>ŞİMDİ ÜCRETSİZ İNDİR</div>

  <h1 class="headline">
    Çukuru gör,<br>
    fotoğrafla,<br>
    <span class="red">bildir.</span>
  </h1>

  <p class="sub">
    Şehrindeki yol hasarlarını <b>tek dokunuşla</b> belediyeye ulaştır.<br>
    Tüm şikayetler haritada herkese açık, çözüm kanıtla.
  </p>

  <div class="phones">
    <div class="phone back"><img src="../app-store-assets/screenshots/6.5-framed/00-ana-sayfa.png" alt=""></div>
    <div class="phone front"><img src="../app-store-assets/screenshots/6.5-framed/01-harita.png" alt=""></div>
  </div>

  <div class="cta-strip">
    <div class="cta-text">
      <div class="lbl">App Store</div>
      <div class="big">Alo Çukur Hattı<br><span class="red">— hemen indir.</span></div>
      <div class="links">📱 <b>@alocukurhatti</b> &nbsp;·&nbsp; 🌐 <b>alocukurhatti.xyz</b></div>
    </div>
    <div class="appbadge">
      <svg class="apple" width="46" height="46" viewBox="0 0 24 24" fill="#000">
        <path d="M17.05 20.28c-.98.95-2.05.86-3.08.43-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.43C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
      </svg>
      <div>
        <div class="at">App Store'da</div>
        <div class="name">Alo Çukur Hattı</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
