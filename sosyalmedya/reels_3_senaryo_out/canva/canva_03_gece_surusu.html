
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #F4F7FB;
      color: #17211f;
    }
    .stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      padding: 86px 74px 74px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.95), rgba(255,255,255,0) 25%),
        linear-gradient(156deg, rgba(255,255,255,.98), rgba(251,249,244,.76) 38%, rgba(255,255,255,.94));
    }
    .stage:before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, #171A2D 0%, rgba(20,51,45,.92) 49%, rgba(255,255,255,0) 49.2%),
        linear-gradient(0deg, rgba(255,255,255,.82), rgba(255,255,255,.18));
      clip-path: polygon(0 0, 100% 0, 100% 31%, 0 58%);
      opacity: .95;
    }
    .stage:after {
      content: "";
      position: absolute;
      left: 54px;
      right: 54px;
      bottom: 52px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #3B6EA5, rgba(255,255,255,.2), #171A2D);
      opacity: .72;
    }
    .top {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .brand {
      font-size: 34px;
      line-height: 1;
    }
    .tag {
      padding: 14px 22px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      font-size: 22px;
    }
    .hero {
      position: relative;
      z-index: 2;
      margin-top: 170px;
      max-width: 690px;
      color: #fff;
    }
    .hook {
      font-size: 74px;
      line-height: .94;
      font-weight: 920;
      letter-spacing: 0;
      text-wrap: balance;
    }
    .step {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
      padding: 12px 18px 12px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      font-size: 22px;
      font-weight: 800;
    }
    .dot {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #3B6EA5;
      color: #fff;
    }
    .phone {
      position: absolute;
      right: 54px;
      top: 582px;
      width: 396px;
      height: 792px;
      border-radius: 58px;
      padding: 12px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 34px 88px rgba(15, 33, 30, .28);
      transform: rotate(2.5deg);
      z-index: 3;
    }
    .phone img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 48px;
    }
    .card {
      position: absolute;
      left: 74px;
      right: 74px;
      bottom: 218px;
      min-height: 330px;
      padding: 42px 42px 38px;
      border-radius: 42px;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(20,51,45,.12);
      box-shadow: 0 28px 74px rgba(31,52,47,.14);
      z-index: 4;
    }
    .card h1 {
      margin: 0;
      width: 610px;
      font-size: 66px;
      line-height: .98;
      font-weight: 920;
      color: #152420;
      letter-spacing: 0;
    }
    .card p {
      margin: 22px 0 0;
      width: 560px;
      font-size: 31px;
      line-height: 1.22;
      font-weight: 650;
      color: rgba(21,36,32,.76);
    }
    .cta {
      position: absolute;
      left: 74px;
      right: 74px;
      bottom: 98px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-radius: 30px;
      padding: 26px 30px;
      background: #171A2D;
      color: #fff;
      box-shadow: 0 18px 40px rgba(20,31,30,.24);
    }
    .cta b {
      font-size: 28px;
      line-height: 1;
    }
    .cta span {
      font-size: 22px;
      opacity: .76;
      font-weight: 700;
    }
    .store {
      white-space: nowrap;
      padding: 18px 23px;
      border-radius: 22px;
      background: #3B6EA5;
      color: #fff;
      font-size: 25px;
      font-weight: 900;
    }
    .canva .hero {
      margin-top: 118px;
    }
    .canva .hook {
      font-size: 67px;
      max-width: 780px;
    }
    .canva .card h1 {
      width: 620px;
      font-size: 62px;
    }
    .canva .card {
      bottom: 245px;
    }
  </style>
</head>
